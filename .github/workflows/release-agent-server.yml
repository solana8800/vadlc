name: Release Private Agent Server

on:
  push:
    tags:
      - 'agent-server-v*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.33)'
        required: true
        default: '0.2.33'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-14
            binary_name: v-adlc-agent-server
            archive_ext: tar.gz
          - platform: linux-x64
            os: ubuntu-latest
            binary_name: v-adlc-agent-server
            archive_ext: tar.gz
          - platform: win32-x64
            os: windows-latest
            binary_name: v-adlc-agent-server.exe
            archive_ext: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "codex-rs -> codex-rs/target"

      - name: Determine Version
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#agent-server-v}"
            VER="${VER#v}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=agent-server-v$VER" >> "$GITHUB_OUTPUT"

      - name: Build Release Binary
        shell: bash
        run: |
          cd codex-rs
          cargo build -p codex-app-server --bin v-adlc-agent-server --release

      - name: Strip & Package Binary (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="codex-rs/target/release/${{ matrix.binary_name }}"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            strip -S "$BIN" || true
          else
            strip --strip-all "$BIN" || true
          fi

          STAGE="stage"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/${{ matrix.binary_name }}"
          chmod 755 "$STAGE/${{ matrix.binary_name }}"
          cp LICENSE NOTICE "$STAGE/" || true

          SHA256_BIN=$(sha256sum "$STAGE/${{ matrix.binary_name }}" | awk '{print $1}')
          cat <<EOF > "$STAGE/runtime-manifest.json"
          {
            "schemaVersion": 1,
            "engine": "v-adlc-agent-server",
            "version": "${{ steps.vars.outputs.version }}",
            "sourceCommit": "${{ github.sha }}",
            "protocol": "app-server-v2",
            "platforms": {
              "${{ matrix.platform }}": {
                "file": "${{ matrix.binary_name }}",
                "sha256": "$SHA256_BIN"
              }
            }
          }
          EOF

          ARCHIVE="v-adlc-agent-server-v${{ steps.vars.outputs.version }}-${{ matrix.platform }}.${{ matrix.archive_ext }}"
          tar -czf "$ARCHIVE" -C "$STAGE" "${{ matrix.binary_name }}" runtime-manifest.json LICENSE NOTICE
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Strip & Package Binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BIN="codex-rs/target/release/${{ matrix.binary_name }}"
          STAGE="stage"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/${{ matrix.binary_name }}"
          cp LICENSE NOTICE "$STAGE/" || true

          SHA256_BIN=$(sha256sum "$STAGE/${{ matrix.binary_name }}" | awk '{print $1}')
          cat <<EOF > "$STAGE/runtime-manifest.json"
          {
            "schemaVersion": 1,
            "engine": "v-adlc-agent-server",
            "version": "${{ steps.vars.outputs.version }}",
            "sourceCommit": "${{ github.sha }}",
            "protocol": "app-server-v2",
            "platforms": {
              "${{ matrix.platform }}": {
                "file": "${{ matrix.binary_name }}",
                "sha256": "$SHA256_BIN"
              }
            }
          }
          EOF

          ARCHIVE="v-adlc-agent-server-v${{ steps.vars.outputs.version }}-${{ matrix.platform }}.${{ matrix.archive_ext }}"
          7z a -tzip "$ARCHIVE" "./$STAGE/*"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}
          path: |
            v-adlc-agent-server-v${{ steps.vars.outputs.version }}-${{ matrix.platform }}.${{ matrix.archive_ext }}
            v-adlc-agent-server-v${{ steps.vars.outputs.version }}-${{ matrix.platform }}.${{ matrix.archive_ext }}.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS
        shell: bash
        run: |
          cd release-files
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag || github.ref_name }}
          files: release-files/*
          generate_release_notes: true
